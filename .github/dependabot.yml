# Dependabot configuration
# Ref: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2

updates:
  # ── Backend Python (pip) ────────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    groups:
      fastapi-stack:
        patterns:
          - "fastapi"
          - "uvicorn*"
          - "pydantic*"
          - "starlette"
      sqlalchemy-stack:
        patterns:
          - "sqlalchemy*"
          - "alembic"
          - "asyncpg"
          - "psycopg2*"
      security:
        patterns:
          - "PyJWT*"
          - "cryptography"
          - "passlib*"
          - "bcrypt"
    ignore:
      # Biblioteca de dados de mercado — API instável entre versões major.
      # Manter atualizações patch/minor; bloquear apenas major.
      - dependency-name: "yfinance"
        update-types: ["version-update:semver-major"]

  # ── Frontend Node.js (npm) ───────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    groups:
      react-stack:
        patterns:
          - "react"
          - "react-dom"
          - "react-router-dom"
          - "@types/react*"
      tanstack:
        patterns:
          - "@tanstack/*"
      build-tools:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "typescript"
          - "tailwindcss"
          - "postcss"
          - "autoprefixer"
      eslint-stack:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"

  # ── GitHub Actions ──────────────────────────────────────────────────────────
  # interval: monthly — actions mudam pouco; weekly gerava PRs desnecessárias.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: 1
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions-core:
        patterns:
          - "actions/*"
      docker-actions:
        patterns:
          - "docker/*"
      security-actions:
        patterns:
          - "aquasecurity/*"
          - "gitleaks/*"
          - "github/codeql-action"
          - "hadolint/*"
