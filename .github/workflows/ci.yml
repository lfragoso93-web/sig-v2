name: SIG v2 CI/CD

# ─────────────────────────────────────────────────────────────────────────────
# DISPAROS
# • push main        → quality + security + build + publish + scan-published
# • pull_request     → quality + security + audit (sem build Docker)
# • workflow_dispatch→ execução manual
#
# paths-ignore: commits que alteram apenas docs/markdown não consomem minutos.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - ".github/dependabot.yml"
      - ".github/dependency-review-config.yml"
      - "docs/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - ".github/dependabot.yml"
      - ".github/dependency-review-config.yml"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend – lint, type check, migrations and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://sgi:sgi@localhost:5432/sgi_ci
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sgi_ci
          POSTGRES_USER: sgi
          POSTGRES_PASSWORD: sgi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sgi -d sgi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Lint (flake8)
        working-directory: backend
        run: |
          flake8 app \
            --max-line-length=120 \
            --extend-ignore=E501,E221 \
            --per-file-ignores="app/models/*.py:F821,F401"

      - name: Type check (mypy)
        working-directory: backend
        run: mypy app

      - name: Fresh database migration gate
        working-directory: backend
        run: |
          alembic upgrade head
          alembic current
          python -m app.governance.alembic_drift_gate

      - name: Tests (pytest)
        working-directory: backend
        run: |
          if ! pytest -qq -x --tb=line --disable-warnings > pytest.log 2>&1; then
            tail -n 80 pytest.log
            exit 1
          fi

      - name: Upload pytest failure log
        if: failure() && hashFiles('backend/pytest.log') != ''
        uses: actions/upload-artifact@v7
        with:
          name: pytest-failure-log
          path: backend/pytest.log
          if-no-files-found: ignore
          retention-days: 3

  frontend-quality:
    name: Frontend – lint, type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Type check (tsc)
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

  secrets-scan:
    name: Secret scan – Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-repository-scan:
    name: Dependency, secret and IaC scan – Trivy filesystem
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Trivy scan – filesystem gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

  audit-python:
    name: Dependency audit – Python (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit --ignore-vuln GHSA-xgmm-8j9v-c9wx

  audit-nodejs:
    name: Dependency audit – Node.js (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run npm audit
        working-directory: frontend
        run: npx audit-ci

  dockerfile-lint-backend:
    name: Dockerfile lint – backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: backend/Dockerfile
          ignore: DL3008,DL3009

  dockerfile-lint-frontend:
    name: Dockerfile lint – frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: frontend/Dockerfile
          ignore: DL3016,DL3018

  build-and-scan-backend:
    name: Build and scan backend Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend-quality, dockerfile-lint-backend, secrets-scan, trivy-repository-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          push: false
          tags: sig-v2-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan – gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sig-v2-backend:ci-${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

  build-and-scan-frontend:
    name: Build and scan frontend Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [frontend-quality, dockerfile-lint-frontend, secrets-scan, trivy-repository-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          push: false
          tags: sig-v2-frontend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan – gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sig-v2-frontend:ci-${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
