name: SIG v2 CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # BACKEND
  # ---------------------------------------------------------------------------
  backend-quality:
    name: Backend – lint, type check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Lint (flake8)
        working-directory: backend
        run: |
          flake8 app \
            --max-line-length=120 \
            --extend-ignore=E501,E221 \
            --per-file-ignores="app/models/*.py:F821,F401"

      - name: Type check (mypy)
        working-directory: backend
        run: mypy app

      - name: Tests (pytest)
        working-directory: backend
        run: pytest

  # ---------------------------------------------------------------------------
  # FRONTEND
  # ---------------------------------------------------------------------------
  frontend-quality:
    name: Frontend – lint, type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Type check (tsc)
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------------------
  # SECURITY
  # ---------------------------------------------------------------------------
  secrets-scan:
    name: Secret scan – Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-repository-scan:
    name: Dependency, secret and IaC scan – Trivy filesystem
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Trivy scan – SARIF (nao bloqueia)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "0"

      - name: Upload SARIF
        if: hashFiles('trivy-fs.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif

      - name: Trivy scan – gate (bloqueia em HIGH/CRITICAL sem fix)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

  # ---------------------------------------------------------------------------
  # DEPENDENCY AUDIT
  # Substitui dependency-review-action (requer GitHub Advanced Security pago).
  # pip-audit e npm audit sao gratuitos e cobrem o mesmo proposito.
  # ---------------------------------------------------------------------------
  audit-python:
    name: Dependency audit – Python (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        working-directory: backend
        # --ignore-vuln GHSA-xgmm-8j9v-c9wx: PyJWT JWK/HMAC confusion — falso positivo.
        # O projeto usa jwt.decode() com algorithms=[settings.ALGORITHM] (HS256 fixo).
        # Nenhuma chave publica JWK e aceita. Ver backend/app/core/security.py -> decode_token()
        run: |
          pip-audit \
            -r requirements.txt \
            --ignore-vuln GHSA-xgmm-8j9v-c9wx \
            --severity high

  audit-nodejs:
    name: Dependency audit – Node.js (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run npm audit
        working-directory: frontend
        # --audit-level=high bloqueia apenas em HIGH e CRITICAL
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------------------
  # DOCKERFILE LINT
  # ---------------------------------------------------------------------------
  dockerfile-lint-backend:
    name: Dockerfile lint – backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: backend/Dockerfile
          ignore: DL3008,DL3009

  dockerfile-lint-frontend:
    name: Dockerfile lint – frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: frontend/Dockerfile
          ignore: DL3016,DL3018

  # ---------------------------------------------------------------------------
  # BUILD & SCAN IMAGES
  # ---------------------------------------------------------------------------
  build-and-scan-backend:
    name: Build and scan backend Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend-quality, dockerfile-lint-backend, secrets-scan, trivy-repository-scan]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          push: false
          tags: sig-v2-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan – SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sig-v2-backend:ci-${{ github.sha }}
          format: sarif
          output: trivy-backend-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "0"

      - name: Upload SARIF
        if: hashFiles('trivy-backend-image.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend-image.sarif

      - name: Trivy image scan – gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sig-v2-backend:ci-${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

  build-and-scan-frontend:
    name: Build and scan frontend Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [frontend-quality, dockerfile-lint-frontend, secrets-scan, trivy-repository-scan]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      # npm ci no Dockerfile exige package-lock.json no contexto de build.
      # Como o lockfile nao esta no repositorio, geramos aqui antes do docker build.
      - name: Generate package-lock.json
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - uses: docker/setup-buildx-action@v4

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          push: false
          pull: true
          tags: sig-v2-frontend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan – SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sig-v2-frontend:ci-${{ github.sha }}
          format: sarif
          output: trivy-frontend-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "0"

      - name: Upload SARIF
        if: hashFiles('trivy-frontend-image.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend-image.sarif

      - name: Trivy image scan – gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sig-v2-frontend:ci-${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

  # ---------------------------------------------------------------------------
  # PUBLISH (main only)
  # ---------------------------------------------------------------------------
  publish-backend:
    name: Publish backend image to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build-and-scan-backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/sig-v2-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

  publish-frontend:
    name: Publish frontend image to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build-and-scan-frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Generate package-lock.json
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/sig-v2-frontend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

  # ---------------------------------------------------------------------------
  # SCAN PUBLISHED DIGESTS
  # ---------------------------------------------------------------------------
  scan-published-backend:
    name: Scan published backend image digest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: publish-backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/sig-v2-backend@${{ needs.publish-backend.outputs.image-digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

  scan-published-frontend:
    name: Scan published frontend image digest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: publish-frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/sig-v2-frontend@${{ needs.publish-frontend.outputs.image-digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
