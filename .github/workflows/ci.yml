name: SIG v2 CI/CD

# ─────────────────────────────────────────────────────────────────────────────
# DISPAROS
# • pull_request main → quality + security + build antes do merge
# • push main         → quality + security + build após o merge; deploy aguarda sucesso
# • workflow_dispatch → execução manual de validação, sem deploy automático
# ─────────────────────────────────────────────────────────────────────────────
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend – lint, type check, migrations and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql+psycopg2://sgi:sgi@localhost:5432/sgi_ci
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sgi_ci
          POSTGRES_USER: sgi
          POSTGRES_PASSWORD: sgi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sgi -d sgi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Validate OCI deployment script syntax
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          lines = Path(".github/workflows/deploy-oci.yml").read_text(encoding="utf-8").splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "script: |")
          first_content = next(line for line in lines[start + 1:] if line.strip())
          indent = len(first_content) - len(first_content.lstrip())
          script = []
          for line in lines[start + 1:]:
              if not line.strip():
                  script.append("")
              elif len(line) - len(line.lstrip()) >= indent:
                  script.append(line[indent:])
              else:
                  break
          subprocess.run(["bash", "-n"], input="\n".join(script), text=True, check=True)
          PY

      - name: Validate OCI SSH action command stream
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          workflow = Path(".github/workflows/deploy-oci.yml").read_text(encoding="utf-8")
          lines = workflow.splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "script: |")
          first_content = next(line for line in lines[start + 1:] if line.strip())
          indent = len(first_content) - len(first_content.lstrip())
          script = []
          for line in lines[start + 1:]:
              if not line.strip():
                  script.append("")
              elif len(line) - len(line.lstrip()) >= indent:
                  script.append(line[indent:])
              else:
                  break

          # Heredoc bodies can consume the action's injected status guard as input.
          # Keep remote Python payloads encoded on one shell command line.
          script_text = "\n".join(script)
          assert "<<" not in script_text
          assert not re.search(r"python\s+-\s", script_text)
          assert not any("python -c '" in line for line in script)
          subprocess.run(["bash", "-n"], input=script_text, text=True, check=True)
          import base64
          import sys
          import tempfile

          payloads = re.findall(r"base64\.b64decode\('([A-Za-z0-9+/=]+)'\)", script_text)
          assert len(payloads) == 2
          decoded = [base64.b64decode(payload).decode("ascii") for payload in payloads]
          for source in decoded:
              compile(source, "<oci-deploy-python>", "exec")

          rotation_index = next(i for i, source in enumerate(decoded) if "root.iterdir()" in source)
          rotation_line = next(line for line in script if "base64.b64decode" in line and "PREDEPLOY_RUN_ID" in line)
          assert '"
          rotation = decoded[rotation_index]
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory) / "oci-predeploy-backups"
              root.mkdir()
              (root / "run-old").mkdir()
              (root / "run-current").mkdir()
              outside = Path(directory) / "outside"
              outside.mkdir()
              (root / "run-linked").symlink_to(outside, target_is_directory=True)
              rotation = rotation.replace(
                  '"/app/artifacts/oci-predeploy-backups"', repr(str(root))
              )
              sys.argv = ["-c", "run-current"]
              exec(compile(rotation, "<oci-backup-rotation>", "exec"), {})
              assert not (root / "run-old").exists()
              assert (root / "run-current").is_dir()
              assert (root / "run-linked").is_symlink()
              assert outside.is_dir()
          PY

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Lint (flake8)
        working-directory: backend
        run: |
          flake8 app \
            --max-line-length=120 \
            --extend-ignore=E501,E221 \
            --per-file-ignores="app/models/*.py:F821,F401"

      - name: Type check (mypy)
        working-directory: backend
        run: mypy app

      - name: Fresh database migration gate
        working-directory: backend
        run: |
          alembic upgrade head
          alembic current
          python -m app.governance.alembic_drift_gate

      - name: Tests (pytest)
        working-directory: backend
        run: |
          if ! pytest -qq -x --tb=line --disable-warnings > pytest.log 2>&1; then
            tail -n 80 pytest.log
            exit 1
          fi

      - name: Upload pytest failure log
        if: failure() && hashFiles('backend/pytest.log') != ''
        uses: actions/upload-artifact@v7
        with:
          name: pytest-failure-log
          path: backend/pytest.log
          if-no-files-found: ignore
          retention-days: 3

  frontend-quality:
    name: Frontend – lint, type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Type check (tsc)
        working-directory: frontend
        run: npm run typecheck

      - name: Unit and component tests (vitest)
        working-directory: frontend
        run: npm test -- run

      - name: Build
        working-directory: frontend
        run: npm run build

  secrets-scan:
    name: Secret scan – Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-repository-scan:
    # Scans de seguranca somente na promocao para main.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    name: Dependency, secret and IaC scan – Trivy filesystem
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Trivy scan – filesystem gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

      - name: Trivy filesystem scan – complete SARIF
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-repository.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "0"

      - name: Publish Trivy filesystem results
        if: always() && hashFiles('trivy-repository.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-repository.sarif

  audit-python:
    name: Dependency audit – Python (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit --ignore-vuln GHSA-xgmm-8j9v-c9wx

  audit-nodejs:
    name: Dependency audit – Node.js (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run npm audit
        working-directory: frontend
        run: npx audit-ci

  dockerfile-lint-backend:
    name: Dockerfile lint – backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: backend/Dockerfile
          ignore: DL3008,DL3009

  dockerfile-lint-frontend:
    name: Dockerfile lint – frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: frontend/Dockerfile
          ignore: DL3016,DL3018

  build-and-scan-backend:
    name: Build and scan backend Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend-quality, dockerfile-lint-backend, secrets-scan, trivy-repository-scan]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile
          load: true
          push: false
          tags: sig-v2-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan – gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sig-v2-backend:ci-${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

      - name: Trivy image scan – complete SARIF
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sig-v2-backend:ci-${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "0"

      - name: Publish Trivy image results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif

  build-and-scan-frontend:
    name: Build and scan frontend Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [frontend-quality, dockerfile-lint-frontend, secrets-scan, trivy-repository-scan]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          push: false
          tags: sig-v2-frontend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan – gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sig-v2-frontend:ci-${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

      - name: Trivy frontend image scan – complete SARIF
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sig-v2-frontend:ci-${{ github.sha }}
          format: sarif
          output: trivy-frontend.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "0"

      - name: Publish Trivy frontend image results
        if: always() && hashFiles('trivy-frontend.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend.sarif
 + '{PREDEPLOY_RUN_ID}"' in rotation_line
          rotation = decoded[rotation_index]
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory) / "oci-predeploy-backups"
              root.mkdir()
              (root / "run-old").mkdir()
              (root / "run-current").mkdir()
              outside = Path(directory) / "outside"
              outside.mkdir()
              (root / "run-linked").symlink_to(outside, target_is_directory=True)
              rotation = rotation.replace(
                  '"/app/artifacts/oci-predeploy-backups"', repr(str(root))
              )
              sys.argv = ["-c", "run-current"]
              exec(compile(rotation, "<oci-backup-rotation>", "exec"), {})
              assert not (root / "run-old").exists()
              assert (root / "run-current").is_dir()
              assert (root / "run-linked").is_symlink()
              assert outside.is_dir()
          PY

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Lint (flake8)
        working-directory: backend
        run: |
          flake8 app \
            --max-line-length=120 \
            --extend-ignore=E501,E221 \
            --per-file-ignores="app/models/*.py:F821,F401"

      - name: Type check (mypy)
        working-directory: backend
        run: mypy app

      - name: Fresh database migration gate
        working-directory: backend
        run: |
          alembic upgrade head
          alembic current
          python -m app.governance.alembic_drift_gate

      - name: Tests (pytest)
        working-directory: backend
        run: |
          if ! pytest -qq -x --tb=line --disable-warnings > pytest.log 2>&1; then
            tail -n 80 pytest.log
            exit 1
          fi

      - name: Upload pytest failure log
        if: failure() && hashFiles('backend/pytest.log') != ''
        uses: actions/upload-artifact@v7
        with:
          name: pytest-failure-log
          path: backend/pytest.log
          if-no-files-found: ignore
          retention-days: 3

  frontend-quality:
    name: Frontend – lint, type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Type check (tsc)
        working-directory: frontend
        run: npm run typecheck

      - name: Unit and component tests (vitest)
        working-directory: frontend
        run: npm test -- run

      - name: Build
        working-directory: frontend
        run: npm run build

  secrets-scan:
    name: Secret scan – Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-repository-scan:
