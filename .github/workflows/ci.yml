name: SIG v2 CI/CD
# Workflow validation run — triggered via PR ci/validate-workflow

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# BACKEND JOBS
# ---------------------------------------------------------------------------
jobs:
  backend-quality:
    name: Backend – lint, type check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Lint with flake8
        working-directory: backend
        run: flake8 app --max-line-length=120

      - name: Type check with mypy
        working-directory: backend
        run: mypy app --ignore-missing-imports

      - name: Run tests with pytest
        working-directory: backend
        run: pytest

  # ---------------------------------------------------------------------------
  # FRONTEND JOBS
  # ---------------------------------------------------------------------------
  frontend-quality:
    name: Frontend – lint, type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------------------
  # SECURITY JOBS
  # ---------------------------------------------------------------------------
  secrets-scan:
    name: Secret scan – Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan hardcoded secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-repository-scan:
    name: Dependency, secret and IaC scan – Trivy filesystem
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan and generate SARIF
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy filesystem SARIF
        if: ${{ hashFiles('trivy-fs.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif

      - name: Run Trivy filesystem scan (gate)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          license-check: false

  # ---------------------------------------------------------------------------
  # DOCKERFILE LINT
  # ---------------------------------------------------------------------------
  dockerfile-lint-backend:
    name: Dockerfile lint – backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint backend Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: backend/Dockerfile
          ignore: DL3008,DL3009

  dockerfile-lint-frontend:
    name: Dockerfile lint – frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint frontend Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: frontend/Dockerfile
          ignore: DL3016,DL3018

  # ---------------------------------------------------------------------------
  # BUILD AND SCAN DOCKER IMAGES (only after all quality gates pass)
  # ---------------------------------------------------------------------------
  build-and-scan-backend:
    name: Build and scan backend Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - backend-quality
      - dockerfile-lint-backend
      - secrets-scan
      - trivy-repository-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image locally
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          push: false
          tags: sig-v2-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy image scan and generate SARIF
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: sig-v2-backend:ci-${{ github.sha }}
          format: sarif
          output: trivy-backend-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy backend image SARIF
        if: ${{ hashFiles('trivy-backend-image.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend-image.sarif

      - name: Run Trivy backend image scan (gate)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: sig-v2-backend:ci-${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  build-and-scan-frontend:
    name: Build and scan frontend Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - frontend-quality
      - dockerfile-lint-frontend
      - secrets-scan
      - trivy-repository-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend Docker image locally
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          push: false
          tags: sig-v2-frontend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy image scan and generate SARIF
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: sig-v2-frontend:ci-${{ github.sha }}
          format: sarif
          output: trivy-frontend-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy frontend image SARIF
        if: ${{ hashFiles('trivy-frontend-image.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend-image.sarif

      - name: Run Trivy frontend image scan (gate)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: sig-v2-frontend:ci-${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # ---------------------------------------------------------------------------
  # PUBLISH TO DOCKER HUB (only on push to main, after all scans pass)
  # ---------------------------------------------------------------------------
  publish-backend:
    name: Publish backend image to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build-and-scan-backend
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate backend Docker tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/sig-v2-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

  publish-frontend:
    name: Publish frontend image to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build-and-scan-frontend
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate frontend Docker tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/sig-v2-frontend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

  # ---------------------------------------------------------------------------
  # SCAN PUBLISHED IMAGES (verify final digest in Docker Hub)
  # ---------------------------------------------------------------------------
  scan-published-backend:
    name: Scan published backend image digest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: publish-backend
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Scan published backend image digest with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/sig-v2-backend@${{ needs.publish-backend.outputs.image-digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  scan-published-frontend:
    name: Scan published frontend image digest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: publish-frontend
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Scan published frontend image digest with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/sig-v2-frontend@${{ needs.publish-frontend.outputs.image-digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
