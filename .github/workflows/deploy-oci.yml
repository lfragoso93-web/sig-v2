name: Deploy to OCI Production

# ─────────────────────────────────────────────────────────────────────────────
# DISPAROS
# • workflow_run (push em main) → executa somente para o SHA aprovado pelo CI
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_run:
    workflows: ["SIG v2 CI/CD"]
    branches: ["main"]
    types:
      - completed
concurrency:
  group: deploy-oci-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Rebuild and Deploy on OCI via SSH
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}
    steps:
      - name: Deploy and Rebuild SGI v2 Stack via SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          CI_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          CI_WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          CI_WORKFLOW_EVENT: ${{ github.event.workflow_run.event || '' }}
          CI_WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_SSH_PORT || 22 }}
          envs: TARGET_SHA,CI_WORKFLOW_RUN_ID,CI_WORKFLOW_CONCLUSION,CI_WORKFLOW_EVENT,CI_WORKFLOW_BRANCH
          command_timeout: 25m
          script_stop: true
          script: |
            set -eu

            TARGET_BRANCH="main"

            if [ -d "/opt/sig-v2" ]; then
              DEPLOY_DIR="/opt/sig-v2"
            elif [ -d "/opt/sgi-v2" ]; then
              DEPLOY_DIR="/opt/sgi-v2"
            else
              echo "[deploy-oci] ERRO: Diretório da aplicação não encontrado em /opt/sig-v2 ou /opt/sgi-v2." >&2
              exit 1
            fi

            echo "=========================================================="
            echo " Início do Deploy Automático no OCI (via GitHub Actions SSH)"
            echo " Diretório de aplicação: ${DEPLOY_DIR}"
            echo " Branch alvo: ${TARGET_BRANCH}"
            echo "=========================================================="

            # Resolve /opt/sgi-v2 symlinks before invoking Compose so its
            # project identity matches the already-running production stack.
            cd -P "${DEPLOY_DIR}"

            compose() {
              docker compose -p sig-v2 \
                -f docker-compose.yml \
                -f docker-compose.prod.yml \
                -f docker-compose.oci.yml "$@"
            }

            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "[deploy-oci] ERRO: tracked local changes prevent deployment." >&2
              exit 1
            fi

            case "${CI_WORKFLOW_RUN_ID}" in
              ''|*[!0-9]*)
                echo "[deploy-oci] ERRO: CI workflow run ID is missing or invalid." >&2
                exit 1
                ;;
            esac

            # Keep automated pre-deploy dumps in a dedicated host directory.
            # Resolve and compare the path before any cleanup so it cannot
            # point at PostgreSQL data, certification artifacts, or app files.
            DEPLOY_DIR_REAL="$(realpath -e -- "${DEPLOY_DIR}")"
            PREDEPLOY_ROOT_EXPECTED="${DEPLOY_DIR_REAL}/artifacts/oci-predeploy-backups"
            compose exec -T backend python -c \
              "from pathlib import Path; Path('/app/artifacts/oci-predeploy-backups').mkdir(parents=True, exist_ok=True)"
            PREDEPLOY_ROOT_REAL="$(realpath -e -- "${PREDEPLOY_ROOT_EXPECTED}")"
            if [ "${PREDEPLOY_ROOT_REAL}" != "${PREDEPLOY_ROOT_EXPECTED}" ]; then
              echo "[deploy-oci] ERRO: diretório dedicado de backup resolve para fora do caminho esperado." >&2
              exit 1
            fi

            echo "==> Criando e validando backup da base em execução antes do checkout..."
            PREDEPLOY_BRANCH="$(compose exec -T backend printenv APP_BRANCH | tr -d '\r')"
            PREDEPLOY_SHA="$(compose exec -T backend printenv APP_COMMIT_SHA | tr -d '\r')"
            case "${PREDEPLOY_BRANCH}" in
              main|stable-15jun) ;;
              *)
                echo "[deploy-oci] ERRO: branch do runtime atual não permitida para backup." >&2
                exit 1
                ;;
            esac
            if ! printf '%s' "${PREDEPLOY_SHA}" | grep -Eq '^[0-9a-fA-F]{40}$'; then
              echo "[deploy-oci] ERRO: SHA do runtime atual inválido; backup/deploy abortados." >&2
              exit 1
            fi
            PREDEPLOY_RUN_ID="run-$(date -u +%Y%m%dT%H%M%SZ)-$$"
            compose exec -T backend python -m app.cli.pre_prod_backup \
              --artifact-root /app/artifacts/oci-predeploy-backups \
              --run-id "${PREDEPLOY_RUN_ID}" \
              --branch "${PREDEPLOY_BRANCH}" \
              --commit-sha "${PREDEPLOY_SHA}" > /dev/null
            compose exec -T backend python -m app.cli.real_data_dataset_identity \
              --artifact-directory "/app/artifacts/oci-predeploy-backups/${PREDEPLOY_RUN_ID}" > /dev/null

            # Rotate only after the new dump passes the canonical artifact
            # validator. The backend user removes only direct child run-* dirs.
            compose exec -T backend python - "${PREDEPLOY_RUN_ID}" <<'PY'
            from pathlib import Path
            import shutil
            import sys

            root = Path("/app/artifacts/oci-predeploy-backups")
            keep = sys.argv[1]
            resolved_root = root.resolve(strict=True)
            if resolved_root != root:
                raise SystemExit("pre-deploy backup root resolves outside its dedicated path")
            for candidate in root.iterdir():
                if (candidate.name.startswith("run-") and candidate.name != keep
                        and not candidate.is_symlink() and candidate.is_dir()):
                    resolved_candidate = candidate.resolve(strict=True)
                    if resolved_candidate.parent != resolved_root:
                        raise SystemExit("refusing to remove backup outside dedicated root")
                    shutil.rmtree(candidate)
            PY

            echo "==> Atualizando repositório a partir de origin/${TARGET_BRANCH}..."
            git fetch origin "${TARGET_BRANCH}"
            git checkout "${TARGET_BRANCH}"
            git pull --ff-only origin "${TARGET_BRANCH}"

            APP_COMMIT_SHA="$(git rev-parse HEAD)"
            if [ "${APP_COMMIT_SHA}" != "${TARGET_SHA}" ]; then
              echo "[deploy-oci] ERRO: main HEAD does not match the CI-approved SHA." >&2
              exit 1
            fi
            echo "==> Commit SHA ativo: ${APP_COMMIT_SHA}"

            if [ ! -f .env ]; then
              echo "[deploy-oci] ERRO: .env de produção não encontrado." >&2
              exit 1
            fi

            export APP_BRANCH="main"
            export APP_COMMIT_SHA

            echo "==> Rebuildando imagens sequencialmente (otimizado para 1 OCPU)..."
            compose build backend
            compose build frontend

            echo "==> Atualizando containers backend e frontend..."
            compose up -d --no-deps backend
            compose up -d --no-deps frontend

            echo "==> Aguardando estabilização do backend..."
            for i in $(seq 1 15); do
              if compose exec -T backend curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done

            echo "==> Validando saúde dos serviços..."
            compose ps
            compose exec -T backend curl -fsS http://localhost:8000/health
            echo ""
            compose exec -T db pg_isready -U "${POSTGRES_USER:-sgi}"
            compose exec -T redis redis-cli ping | grep -q PONG
            COMPOSE_PROJECT_NAME=sig-v2 sh scripts/oci_smoke_test.sh

            RUNTIME_BRANCH="$(compose exec -T backend printenv APP_BRANCH | tr -d '\r')"
            RUNTIME_SHA="$(compose exec -T backend printenv APP_COMMIT_SHA | tr -d '\r')"
            if [ "${RUNTIME_BRANCH}" != "main" ] || [ "${RUNTIME_SHA}" != "${TARGET_SHA}" ]; then
              echo "[deploy-oci] ERRO: identidade do container difere do SHA aprovado pelo CI." >&2
              exit 1
            fi

            case "${CI_WORKFLOW_RUN_ID}" in
              ''|*[!0-9]*)
                echo "[deploy-oci] ERRO: workflow run de CI ausente ou invÃ¡lido." >&2
                exit 1
                ;;
            esac

            echo "==> Persistindo a identidade implantada em .env..."
            ENV_TMP="$(mktemp .env.deploy.XXXXXX)"
            trap 'rm -f "${ENV_TMP}"' EXIT
            chmod --reference=.env "${ENV_TMP}"
            awk -v branch="${APP_BRANCH}" -v sha="${APP_COMMIT_SHA}" '
              /^APP_BRANCH=/ { if (++branch_count > 1) exit 2; print "APP_BRANCH=" branch; next }
              /^APP_COMMIT_SHA=/ { if (++sha_count > 1) exit 2; print "APP_COMMIT_SHA=" sha; next }
              { print }
              END {
                if (branch_count == 0) print "APP_BRANCH=" branch
                if (sha_count == 0) print "APP_COMMIT_SHA=" sha
              }
            ' .env > "${ENV_TMP}" || {
              echo "[deploy-oci] ERRO: entradas de identidade duplicadas em .env." >&2
              exit 1
            }
            mv "${ENV_TMP}" .env
            trap - EXIT

            echo "==> Certificando automaticamente o SHA aprovado pelo CI..."
            CERT_REPORT="/app/artifacts/real-data-certification/releases/${TARGET_SHA}.json"
            CERT_DRY_RUN="/tmp/real-data-release-${TARGET_SHA}.dry-run.json"
            compose exec -T backend python -m app.cli.real_data_release_certification \
              --expected-sha "${TARGET_SHA}" \
              --workflow-run-id "${CI_WORKFLOW_RUN_ID}" \
              --workflow-run-conclusion "${CI_WORKFLOW_CONCLUSION}" \
              --workflow-run-event "${CI_WORKFLOW_EVENT}" \
              --workflow-run-branch "${CI_WORKFLOW_BRANCH}" \
              --smoke-test-passed \
              --report-file "${CERT_DRY_RUN}" > /dev/null
            CERT_MODE="$(compose exec -T backend python -c \
              "import json; print(json.load(open('${CERT_DRY_RUN}', encoding='utf-8'))['mode'])")"
            if [ "${CERT_MODE}" = "dry-run" ]; then
              CERT_CONFIRMATION="$(compose exec -T backend python -c \
                "import json; print(json.load(open('${CERT_DRY_RUN}', encoding='utf-8'))['plan']['confirmation'])")"
              if [ -z "${CERT_CONFIRMATION}" ]; then
                echo "[deploy-oci] ERRO: dry-run nÃ£o emitiu confirmaÃ§Ã£o de certificaÃ§Ã£o." >&2
                exit 1
              fi
              compose exec -T backend python -m app.cli.real_data_release_certification \
                --expected-sha "${TARGET_SHA}" \
                --workflow-run-id "${CI_WORKFLOW_RUN_ID}" \
                --workflow-run-conclusion "${CI_WORKFLOW_CONCLUSION}" \
                --workflow-run-event "${CI_WORKFLOW_EVENT}" \
                --workflow-run-branch "${CI_WORKFLOW_BRANCH}" \
                --smoke-test-passed \
                --report-file "${CERT_REPORT}" \
                --execute \
                --confirmation "${CERT_CONFIRMATION}" > /dev/null
            elif [ "${CERT_MODE}" != "already-certified" ]; then
              echo "[deploy-oci] ERRO: modo de certificaÃ§Ã£o inesperado." >&2
              exit 1
            fi

            echo "==> Validando prontidÃ£o certificada para o SHA implantado..."
            compose exec -T backend curl -fsS http://localhost:8000/ready
            echo ""

            echo "=========================================================="
            echo " Deploy e rebuild concluídos com sucesso no OCI!"
            echo " Runtime SHA: ${APP_COMMIT_SHA}"
            echo "=========================================================="
