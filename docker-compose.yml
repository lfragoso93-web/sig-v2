services:

  # ── Banco de dados ──────────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-sgi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sgi}
      POSTGRES_DB:       ${POSTGRES_DB:-sgi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sgi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sig-net

  # ── Cache Redis ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - sig-net

  # ── Backend FastAPI ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      ASYNC_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sgi}:${POSTGRES_PASSWORD:-sgi}@db:5432/${POSTGRES_DB:-sgi}
      REDIS_URL:          redis://redis:6379/0
      # :? garante falha imediata se SECRET_KEY nao estiver no .env
      SECRET_KEY:         ${SECRET_KEY:?Defina SECRET_KEY no arquivo .env}
      BRAPI_TOKEN:        ${BRAPI_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sig-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Frontend React + Nginx ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sig-net

volumes:
  postgres_data:

networks:
  sig-net:
    driver: bridge
