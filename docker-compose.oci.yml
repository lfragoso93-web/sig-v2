services:
  backend:
    ports: !reset []
    environment:
      ENVIRONMENT: production
      APP_DEBUG: "false"
      RUNTIME_MIGRATION_TARGET: "20261111_fraction_settlements"
    healthcheck:
      start_period: 90s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    ports: !reset []
    depends_on:
      backend:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    user: "${CLOUDFLARED_UID:-1000}"
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    command:
      - tunnel
      - --no-autoupdate
      - run
    depends_on:
      frontend:
        condition: service_started
    networks:
      - sig-net

secrets:
  cloudflare_tunnel_token:
    file: ${CLOUDFLARE_TUNNEL_TOKEN_FILE:-.cloudflared/tunnel-token}
