services:
  backend:
    ports: !reset []
    environment:
      ENVIRONMENT: production
      APP_DEBUG: "false"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    ports: !reset []
    depends_on:
      backend:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in the VM .env}
    depends_on:
      frontend:
        condition: service_started
    networks:
      - sig-net
