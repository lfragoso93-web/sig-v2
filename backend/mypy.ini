[mypy]
python_version = 3.12
ignore_missing_imports = True
warn_unused_ignores = False
no_strict_optional = False

# SQLAlchemy forward references e Column[T] vs T sem plugin mypy-sqlalchemy
[mypy-app.models.*]
ignore_errors = True

[mypy-app.services.*]
ignore_errors = True

[mypy-app.scheduler]
ignore_errors = True

[mypy-app.integrations.brapi_dividends]
ignore_errors = True

[mypy-app.core.deps]
ignore_errors = True

[mypy-app.routers.*]
ignore_errors = True
