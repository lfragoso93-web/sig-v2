[flake8]
max-line-length = 120
extend-ignore =
    # E501 linha longa — controlado por max-line-length
    E501,
    # W503/W504 — quebra de linha antes/depois de operador binario
    W503,
    W504,
    # E241/E221 — alinhamento de espacos (estilo tabular intencional)
    E241,
    E221,
exclude =
    .git,
    __pycache__,
    alembic/versions,
    .venv,
    venv

[mypy]
python_version = 3.12
ignore_missing_imports = True
warn_return_any = False
warn_unused_ignores = False
disallow_untyped_defs = False
# Desabilita erros de var-annotated em modelos SQLAlchemy
disallow_any_generics = False
plugins = sqlalchemy.ext.mypy.plugin

[mypy-app.models.*]
ignore_errors = True

[mypy-app.routers.*]
ignore_errors = True

[mypy-alembic.*]
ignore_errors = True
