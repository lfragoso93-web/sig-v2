title = "SGI v2 Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Known non-secret market-data domain identifiers"
regexTarget = "secret"
regexes = [
  '''brapi_v2_crypto_max''',
  '''yfinance_crypto_ptax_brl_max''',
  '''coingecko_market_cap_intersect_brapi''',
  '''crypto_top100_market_cap''',
  '''CRYPTO_TOP100_UNIVERSE_KEY''',
]

[[allowlists]]
description = "Non-secret BRAPI corporate-event label documented in reconciliation changelog"
condition = "AND"
regexTarget = "secret"
paths = [
  '''CHANGELOG\.md''',
  '''docs/changelog/2026-09-15-promotion-reconciliation-158-corporate-event-decision\.md''',
]
regexes = [
  '''label=GRUPAMENTO''',
]
